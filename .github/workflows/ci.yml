name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Test and build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test the package
        # The live tests need Apple Intelligence, which GitHub's runners don't have, so they skip themselves.
        run: swift test
      - name: Build the iPhone app
        run: xcodebuild -project App/Immerse.xcodeproj -scheme Immerse -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
